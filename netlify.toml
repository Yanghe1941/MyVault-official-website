[build]
  publish = "."
  command = ""

# Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://api.producthunt.com https://ph-files.imgix.net https://www.producthunt.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://ph-files.imgix.net https://api.producthunt.com; font-src 'self'; connect-src 'self'; frame-src https://www.producthunt.com;"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"

# Optional: ensure clean URLs like /en/guide (Netlify will also serve guide.html)
[[redirects]]
  from = "/en/guide"
  to = "/en/guide.html"
  status = 200

[[redirects]]
  from = "/en/privacy"
  to = "/en/privacy.html"
  status = 200

[[redirects]]
  from = "/en/terms"
  to = "/en/terms.html"
  status = 200

[[redirects]]
  from = "/zh/guide"
  to = "/zh/guide.html"
  status = 200

[[redirects]]
  from = "/zh/privacy"
  to = "/zh/privacy.html"
  status = 200

[[redirects]]
  from = "/zh/terms"
  to = "/zh/terms.html"
  status = 200
